<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NorthStar Bank - ตั้งค่าบัญชี</title>
    <style>
        body {
            background-color: #0b132b;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .settings-container {
            background: rgba(0, 180, 216, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 180, 216, 0.25);
            border-radius: 24px;
            padding: 30px 24px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            box-sizing: border-box;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
        }

        .header-bar h2 {
            margin: 0;
            font-size: 18px;
            color: #4cc9f0;
        }

        .btn-back {
            background: rgba(76, 201, 240, 0.15);
            border: 1px solid rgba(76, 201, 240, 0.4);
            color: #4cc9f0;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #a0aec0;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: #4cc9f0;
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 180, 216, 0.3);
            border-radius: 10px;
            padding: 10px 12px;
            color: #ffffff;
            font-size: 13px;
            outline: none;
            box-sizing: border-box;
        }

        .btn-submit {
            width: 100%;
            background: #4cc9f0;
            color: #0b132b;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 6px;
        }

        .btn-submit:active {
            background: #3aa8d0;
        }

        .divider {
            margin: 24px 0;
            border: 0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <div class="settings-container">
        <div class="header-bar">
            <h2>⚙️ ตั้งค่าความปลอดภัย</h2>
            <a href="index.html" class="btn-back">⬅ กลับหน้าหลัก</a>
        </div>

        <!-- ฟอร์มเปลี่ยนรหัสผ่าน -->
        <form id="change-password-form">
            <div class="section-title">เปลี่ยนรหัสผ่าน (Password)</div>
            <div class="form-group">
                <label>รหัสผ่านใหม่</label>
                <input type="password" id="new-password" class="form-control" placeholder="กรอกรหัสผ่านใหม่" required>
            </div>
            <button type="submit" class="btn-submit">อัปเดตรหัสผ่าน</button>
        </form>

        <hr class="divider">

        <!-- ฟอร์มเปลี่ยนรหัส PIN -->
        <form id="change-pin-form">
            <div class="section-title">เปลี่ยนรหัส PIN (6 หลัก)</div>
            <div class="form-group">
                <label>รหัส PIN ใหม่ (6 หลัก)</label>
                <input type="password" id="new-pin" class="form-control" maxlength="6" placeholder="••••••" required>
            </div>
            <button type="submit" class="btn-submit" style="background: rgba(255, 193, 7, 0.85); color: #0b132b;">อัปเดตรหัส PIN</button>
        </form>
    </div>

    <!-- ส่วนสคริปต์ทำงาน -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBGDB_x2dpynWk7ZvHmxXDJ6P4PTNfhtfE",
            authDomain: "northstar-bank-23895.firebaseapp.com",
            projectId: "northstar-bank-23895",
            storageBucket: "northstar-bank-23895.firebasestorage.app",
            messagingSenderId: "1040359606999",
            appId: "1:1040359606999:web:2d6ec0ca70088c7d5ffe92"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // กำหนด UID จำลองชั่วคราวเพื่อไม่ให้เด้งหลุดไปหน้าล็อกอิน
        const userUid = localStorage.getItem('northstar_user_uid') || "test_user_12345";

        // เปลี่ยนรหัสผ่าน
        document.getElementById('change-password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('new-password').value.trim();

            if (!newPassword) {
                alert("กรุณากรอกรหัสผ่านใหม่");
                return;
            }

            try {
                const userRef = doc(db, "users", userUid);
                await updateDoc(userRef, { password: newPassword });
                alert("✨ เปลี่ยนรหัสผ่านสำเร็จ!");
                document.getElementById('new-password').value = "";
            } catch (error) {
                console.error("Error updating password:", error);
                alert("เกิดข้อผิดพลาดในการเปลี่ยนรหัสผ่าน");
            }
        });

        // เปลี่ยนรหัส PIN
        document.getElementById('change-pin-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPin = document.getElementById('new-pin').value.trim();

            if (newPin.length !== 6 || isNaN(newPin)) {
                alert("⚠️ กรุณากรอกรหัส PIN เป็นตัวเลข 6 หลักให้ถูกต้อง");
                return;
            }

            try {
                const userRef = doc(db, "users", userUid);
                await updateDoc(userRef, { pin: newPin });
                alert("✨ เปลี่ยนรหัส PIN สำเร็จ!");
                document.getElementById('new-pin').value = "";
            } catch (error) {
                console.error("Error updating PIN:", error);
                alert("เกิดข้อผิดพลาดในการเปลี่ยนรหัส PIN");
            }
        });
    </script>
</body>
</html>
