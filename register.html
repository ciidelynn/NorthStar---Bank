<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NorthStar Bank - สมัครสมาชิก</title>
    <!-- อ้างอิงไฟล์ CSS จากโฟลเดอร์ css -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">

    <div class="auth-card">
        <!-- กรอบข้อความกำกับหน้าสมัครสมาชิก -->
        <div style="background: rgba(0, 180, 216, 0.1); border: 1px dashed var(--accent-glow); padding: 6px 10px; border-radius: 8px; margin-top: -10px; margin-bottom: 20px; text-align: center;">
            <span style="color: var(--accent-glow); font-size: 12px; font-weight: 600;">📝 REGISTER (Register Page)</span>
        </div>

        <div style="text-align: center; margin-bottom: 24px;">
            <h2 style="margin: 0; font-size: 24px; color: var(--text-main);">NorthStar Bank</h2>
            <p class="subtitle" style="margin: 4px 0 0 0;">สร้างบัญชีผู้ใช้ใหม่</p>
        </div>

        <!-- กล่องแจ้งเตือน Error -->
        <div id="reg-error-message" style="color: #ff4b4b; font-size: 13px; text-align: center; margin-bottom: 12px; display: none;"></div>

        <!-- ช่องกรอก (แสดงคำว่า Username แต่รองรับการพิมพ์อีเมล) -->
        <div style="margin-bottom: 16px;">
            <label style="color: var(--text-muted); font-size: 13px; display: block; margin-bottom: 6px;">กำหนด Username</label>
            <input type="text" id="reg-username" placeholder="username">
        </div>

        <!-- ช่องกรอกรหัสผ่าน -->
        <div style="margin-bottom: 24px;">
            <label style="color: var(--text-muted); font-size: 13px; display: block; margin-bottom: 6px;">กำหนดรหัสผ่าน</label>
            <input type="password" id="reg-password" placeholder="••••••••">
        </div>

        <!-- ปุ่มสมัครสมาชิก -->
        <button type="button" id="btn-register" class="btn btn-primary" style="margin-bottom: 16px;">สมัครสมาชิก</button>

        <div style="text-align: center; font-size: 14px;">
            <span style="color: var(--text-muted);">มีบัญชีอยู่แล้ว? </span>
            <a href="index.html" style="color: var(--accent-glow); text-decoration: none; font-weight: 600;">เข้าสู่ระบบ</a>
        </div>
    </div>

    <!-- โหลดสคริปต์หลักจากโฟลเดอร์ js -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
