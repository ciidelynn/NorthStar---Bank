<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NorthStar Bank - สร้างบัญชีใหม่</title>
    <style>
        body {
            background-color: #0b132b;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .create-container {
            background: rgba(0, 180, 216, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 180, 216, 0.25);
            border-radius: 24px;
            padding: 30px 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            box-sizing: border-box;
        }

        .logo-area {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo-area h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
        }

        .logo-area p {
            margin: 6px 0 0 0;
            font-size: 13px;
            color: #a0aec0;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: #4cc9f0;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .form-control, .form-select {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 180, 216, 0.3);
            border-radius: 12px;
            padding: 12px 14px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
        }

        .form-control:focus, .form-select:focus {
            border-color: #4cc9f0;
            box-shadow: 0 0 10px rgba(76, 201, 240, 0.3);
        }

        .btn-submit {
            width: 100%;
            background: #4cc9f0;
            color: #0b132b;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s ease;
        }

        .btn-submit:active {
            background: #3aa8d0;
            transform: scale(0.98);
        }

        .btn-back {
            display: block;
            text-align: center;
            margin-top: 16px;
            font-size: 13px;
            color: #a0aec0;
            text-decoration: none;
        }

        .btn-back:hover {
            color: #4cc9f0;
            text-decoration: underline;
        }

        /* สไตล์ Toast แจ้งเตือน */
        .cute-toast-bubble {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: linear-gradient(135deg, rgba(76, 201, 240, 0.95), rgba(67, 97, 238, 0.95));
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(76, 201, 240, 0.4);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 600;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;
        }

        .cute-toast-bubble.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="create-container">
        <div class="logo-area">
            <h1>⭐ เปิดบัญชีใหม่</h1>
            <p>NorthStar Bank - กำหนดรายละเอียดบัญชีของคุณ</p>
        </div>

        <form id="create-account-form">
            <div class="form-group">
                <label>ชื่อบัญชี (ตั้งชื่อเอง)</label>
                <input type="text" id="acc-name" class="form-control" placeholder="เช่น บัญชีเก็บเงินออม, บัญชีร้านค้า" required>
            </div>

            <div class="form-group">
                <label>รูปแบบบัญชี</label>
                <select id="acc-type" class="form-select">
                    <option value="personal">บัญชีส่วนตัว</option>
                    <option value="business">บัญชีธุรกิจ</option>
                </select>
            </div>

            <button type="submit" class="btn-submit">ยืนยันการเปิดบัญชี</button>
        </form>

        <a href="home.html" class="btn-back">← กลับสู่หน้าหลัก</a>
    </div>

    <!-- Script เชื่อมต่อ Firebase และควบคุมการสร้างบัญชี -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBGDB_x2dpynWk7ZvHmxXDJ6P4PTNfhtfE",
            authDomain: "northstar-bank-23895.firebaseapp.com",
            projectId: "northstar-bank-23895",
            storageBucket: "northstar-bank-23895.firebasestorage.app",
            messagingSenderId: "1040359606999",
            appId: "1:1040359606999:web:2d6ec0ca70088c7d5ffe92",
            measurementId: "G-BFLFYLF8DW"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        function showCuteToast(message, isSuccess = true) {
            const existingToast = document.getElementById("cute-toast");
            if (existingToast) existingToast.remove();

            const toast = document.createElement("div");
            toast.id = "cute-toast";
            toast.className = "cute-toast-bubble";
            
            const icon = isSuccess ? "✨" : "⚠️";
            toast.innerHTML = `<span>${icon}</span> <span>${message}</span>`;

            if (!isSuccess) {
                toast.style.background = "linear-gradient(135deg, rgba(255, 75, 75, 0.95), rgba(220, 38, 38, 0.95))";
            }

            document.body.appendChild(toast);
            setTimeout(() => toast.classList.add("show"), 50);
            setTimeout(() => {
                toast.classList.remove("show");
                setTimeout(() => toast.remove(), 400);
            }, 2500);
        }

        // ตรวจสอบเซสชันผู้ใช้
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "index.html";
            }
        });

        // จัดการฟอร์มเมื่อกดสร้างบัญชี
        document.getElementById("create-account-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const accountName = document.getElementById("acc-name").value.trim();
            const accountType = document.getElementById("acc-type").value;

            if (!accountName) {
                showCuteToast("กรุณากรอกชื่อบัญชี", false);
                return;
            }

            const user = auth.currentUser;
            if (!user) {
                showCuteToast("เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่", false);
                window.location.href = "index.html";
                return;
            }

            try {
                const userDocRef = doc(db, "users", user.uid);
                const userDocSnap = await getDoc(userDocRef);

                if (userDocSnap.exists()) {
                    const userData = userDocSnap.data();
                    const accounts = userData.accounts || [];

                    // จำกัดสูงสุด 3 บัญชี
                    if (accounts.length >= 3) {
                        showCuteToast("คุณมีบัญชีครบตามกำหนดสูงสุด 3 บัญชีแล้ว", false);
                        return;
                    }

                    // สุ่มเลขบัญชี 10 หลัก
                    const randomAccNum = Math.floor(1000000000 + Math.random() * 9000000000).toString();
                    
                    const newAccountObj = {
                        accountName: accountName,
                        accountNumber: randomAccNum,
                        accountType: accountType,
                        balance: 0.00
                    };

                    await updateDoc(userDocRef, {
                        accounts: arrayUnion(newAccountObj)
                    });

                    showCuteToast("✨ เปิดบัญชีใหม่สำเร็จ!", true);
                    setTimeout(() => {
                        window.location.href = "home.html";
                    }, 1200);
                }
            } catch (error) {
                console.error("Error creating account:", error);
                showCuteToast("เกิดข้อผิดพลาดในการสร้างบัญชี", false);
            }
        });
    </script>
</body>
</html>
