<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NorthStar Bank - โอนเงิน</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background-color: #0b132b;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header-card {
            background: rgba(0, 180, 216, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 180, 216, 0.25);
            border-radius: 24px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            box-sizing: border-box;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 180, 216, 0.3);
            color: #4cc9f0;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.2s;
        }

        .header-title {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            margin: 0;
        }

        .card-box {
            background: rgba(0, 180, 216, 0.06);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 180, 216, 0.25);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 500;
        }

        .form-input, .form-select {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 180, 216, 0.3);
            border-radius: 12px;
            padding: 12px 14px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
            width: 100%;
        }

        .form-select option {
            background: #0b132b;
            color: #ffffff;
        }

        .btn-submit {
            background: #4cc9f0;
            color: #0b132b;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 6px;
        }

        .btn-submit:active {
            transform: scale(0.98);
            background: #3aa8cb;
        }

        /* Modal สลิปโอนเงิน */
        .slip-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 999;
            padding: 16px;
            box-sizing: border-box;
        }

        .slip-card {
            background: #ffffff;
            color: #111111;
            width: 100%;
            max-width: 360px;
            border-radius: 24px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            box-sizing: border-box;
            animation: scaleUp 0.3s ease;
        }

        @keyframes scaleUp {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .slip-header {
            text-align: center;
            border-bottom: 2px dashed #eeeeee;
            padding-bottom: 14px;
        }

        .slip-logo {
            font-size: 18px;
            font-weight: 700;
            color: #0b132b;
        }

        .slip-status {
            font-size: 14px;
            color: #2a9d8f;
            font-weight: 600;
            margin-top: 4px;
        }

        .slip-body {
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 13px;
        }

        .slip-row {
            display: flex;
            justify-content: space-between;
        }

        .slip-label {
            color: #666666;
        }

        .slip-value {
            font-weight: 600;
            color: #222222;
            text-align: right;
        }

        .slip-amount-box {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            margin: 4px 0;
        }

        .slip-amount-title {
            font-size: 11px;
            color: #666666;
        }

        .slip-amount-value {
            font-size: 22px;
            font-weight: 700;
            color: #2a9d8f;
            margin-top: 2px;
        }

        .slip-footer {
            border-top: 1px solid #eeeeee;
            padding-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-slip-back {
            background: #0b132b;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ส่วนหัว -->
        <div class="header-card">
            <a href="home.html" class="back-btn">‹</a>
            <h1 class="header-title">โอนเงิน</h1>
        </div>

        <!-- ฟอร์มโอนเงิน -->
        <div class="card-box">
            <div class="form-group">
                <label class="form-label">บัญชีผู้โอน (บัญชีปัจจุบันของคุณ)</label>
                <div id="sender-acc-info" class="form-input" style="background: rgba(0,180,216,0.1); color: #4cc9f0; font-weight: 600;">
                    กำลังโหลด...
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">เลือกประเภทบัญชีปลายทาง</label>
                <select id="transfer-target-type" class="form-select">
                    <option value="other">บัญชีบุคคลอื่น / เลขบัญชีอื่น</option>
                    <option value="own">บัญชีอื่นๆ ของฉันเอง</option>
                </select>
            </div>

            <!-- กรณีโอนให้คนอื่น / ระบุเลขบัญชี -->
            <div class="form-group" id="group-other-acc">
                <label class="form-label">เลขบัญชีปลายทาง (10 หลัก)</label>
                <input type="text" id="target-acc-num" class="form-input" maxlength="10" placeholder="กรอกเลขบัญชี 10 หลัก">
            </div>

            <!-- กรณีเลือกโอนระหว่างบัญชีตัวเอง -->
            <div class="form-group" id="group-own-acc" style="display: none;">
                <label class="form-label">เลือกบัญชีปลายทางของคุณ</label>
                <select id="target-own-select" class="form-select">
                    <!-- เรนเดอร์บัญชีอื่นๆ ที่ไม่ใช่บัญชีหลัก -->
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">จำนวนเงิน (บาท)</label>
                <input type="number" id="transfer-amount" class="form-input" placeholder="0.00" min="1">
            </div>

            <div class="form-group">
                <label class="form-label">หมายเหตุ (ไม่ใส่ก็ได้)</label>
                <input type="text" id="transfer-note" class="form-input" placeholder="เช่น ค่าอาหาร, ค่าสินค้า">
            </div>

            <button type="button" id="btn-confirm-transfer" class="btn-submit">ยืนยันการโอนเงิน</button>
        </div>
    </div>

    <!-- Modal แสดงสลิปหลังโอนสำเร็จ -->
    <div class="slip-modal" id="slipModal">
        <div class="slip-card">
            <div class="slip-header">
                <div class="slip-logo">⭐ NorthStar Bank</div>
                <div class="slip-status">✔ โอนเงินสำเร็จ</div>
            </div>
            <div class="slip-body">
                <div class="slip-row">
                    <span class="slip-label">วันที่ - เวลา</span>
                    <span class="slip-value" id="slip-datetime">-</span>
                </div>
                <div class="slip-row">
                    <span class="slip-label">ผู้โอน</span>
                    <span class="slip-value" id="slip-sender-name">-</span>
                </div>
                <div class="slip-row">
                    <span class="slip-label">เลขบัญชีผู้โอน</span>
                    <span class="slip-value" id="slip-sender-num">-</span>
                </div>
                <div class="slip-row">
                    <span class="slip-label">ผู้รับเงิน</span>
                    <span class="slip-value" id="slip-receiver-name">-</span>
                </div>
                <div class="slip-row">
                    <span class="slip-label">เลขบัญชีผู้รับ</span>
                    <span class="slip-value" id="slip-receiver-num">-</span>
                </div>
                
                <div class="slip-amount-box">
                    <div class="slip-amount-title">จำนวนเงิน</div>
                    <div class="slip-amount-value" id="slip-amount">฿0.00</div>
                </div>

                <div class="slip-row">
                    <span class="slip-label">หมายเหตุ</span>
                    <span class="slip-value" id="slip-note">-</span>
                </div>
            </div>
            <div class="slip-footer">
                <a href="home.html" class="btn-slip-back">กลับสู่หน้าหลัก</a>
            </div>
        </div>
    </div>

    <!-- เชื่อมต่อ Firebase และจัดการระบบโอนเงินข้ามผู้ใช้ -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBGDB_x2dpynWk7ZvHmxXDJ6P4PTNfhtfE",
            authDomain: "northstar-bank-23895.firebaseapp.com",
            projectId: "northstar-bank-23895",
            storageBucket: "northstar-bank-23895.firebasestorage.app",
            messagingSenderId: "1040359606999",
            appId: "1:1040359606999:web:2d6ec0ca70088c7d5ffe92"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const userUid = localStorage.getItem('northstar_user_uid');
        if (!userUid) {
            alert("กรุณาเข้าสู่ระบบก่อนใช้งาน");
            window.location.href = "index.html";
        }

        let currentData = null;
        let accounts = [];
        let activeIndex = parseInt(localStorage.getItem('active_account_index')) || 0;
        let senderAcc = null;

        // ดึงข้อมูลผู้ใช้ปัจจุบันจาก Firestore
        async function loadUserData() {
            try {
                const userRef = doc(db, "users", userUid);
                const userSnap = await getDoc(userRef);

                if (userSnap.exists()) {
                    currentData = userSnap.data();
                    accounts = currentData.accounts || JSON.parse(localStorage.getItem('user_accounts')) || [
                        { accountNumber: '3837198028', accountName: 'บัญชีออมทรัพย์หลัก', balance: 0.00 }
                    ];
                    
                    senderAcc = accounts[activeIndex] || accounts[0];

                    document.getElementById('sender-acc-info').innerText = `${senderAcc.accountName} (${senderAcc.accountNumber}) - ยอดเงิน: ฿${Number(senderAcc.balance).toLocaleString('en-US', { minimumFractionDigits: 2 })}`;
                } else {
                    alert("ไม่พบข้อมูลผู้ใช้งาน");
                    window.location.href = "index.html";
                }
            } catch (error) {
                console.error("Error loading user data:", error);
                document.getElementById('sender-acc-info').innerText = "เกิดข้อผิดพลาดในการโหลดข้อมูล";
            }
        }

        loadUserData();

        // ตรวจสอบ Parameter จาก URL สำหรับโอนด่วน
        const urlParams = new URLSearchParams(window.location.search);
        const paramAccount = urlParams.get('account');
        const paramName = urlParams.get('name');

        if (paramAccount) {
            const targetTypeSelect = document.getElementById('transfer-target-type');
            targetTypeSelect.value = 'other';
            
            document.getElementById('group-other-acc').style.display = 'flex';
            document.getElementById('group-own-acc').style.display = 'none';

            document.getElementById('target-acc-num').value = paramAccount;

            if (paramName) {
                window.selectedReceiverParamName = decodeURIComponent(paramName);
            }
        }

        // จัดการฟิลด์เลือกประเภทบัญชีปลายทาง
        const targetTypeSelect = document.getElementById('transfer-target-type');
        const groupOther = document.getElementById('group-other-acc');
        const groupOwn = document.getElementById('group-own-acc');
        const targetOwnSelect = document.getElementById('target-own-select');

        targetTypeSelect.addEventListener('change', (e) => {
            if (e.target.value === 'own') {
                groupOther.style.display = 'none';
                groupOwn.style.display = 'flex';
                
                targetOwnSelect.innerHTML = '';
                accounts.forEach((acc, idx) => {
                    if (idx !== activeIndex) {
                        const opt = document.createElement('option');
                        opt.value = idx;
                        opt.text = `${acc.accountName} (${acc.accountNumber})`;
                        targetOwnSelect.appendChild(opt);
                    }
                });

                if (targetOwnSelect.options.length === 0) {
                    alert('คุณไม่มีบัญชีอื่นในระบบ กรุณาสร้างบัญชีเพิ่มก่อน');
                    targetTypeSelect.value = 'other';
                    groupOther.style.display = 'flex';
                    groupOwn.style.display = 'none';
                }
            } else {
                groupOther.style.display = 'flex';
                groupOwn.style.display = 'none';
            }
        });

        // ดำเนินการโอนเงินจริงผ่าน Firestore
        document.getElementById('btn-confirm-transfer').addEventListener('click', async () => {
            const amountVal = parseFloat(document.getElementById('transfer-amount').value);
            const noteVal = document.getElementById('transfer-note').value.trim() || '-';
            const targetType = targetTypeSelect.value;

            if (!amountVal || amountVal <= 0) {
                alert('กรุณากรอกจำนวนเงินให้ถูกต้อง');
                return;
            }

            if (!senderAcc || senderAcc.balance < amountVal) {
                alert('ยอดเงินในบัญชีของคุณไม่เพียงพอสำหรับการโอน');
                return;
            }

            let receiverName = '';
            let receiverNum = '';
            let receiverDocId = null;
            let receiverAccountIndex = -1;

            if (targetType === 'own') {
                const ownIdx = parseInt(targetOwnSelect.value);
                receiverAccountIndex = ownIdx;
                receiverName = accounts[ownIdx].accountName;
                receiverNum = accounts[ownIdx].accountNumber;
            } else {
                receiverNum = document.getElementById('target-acc-num').value.trim();
                if (receiverNum.length !== 10) {
                    alert('กรุณากรอกเลขบัญชีปลายทางให้ครบ 10 หลัก');
                    return;
                }

                if (receiverNum === senderAcc.accountNumber) {
                    alert('ไม่สามารถโอนเข้าบัญชีเดียวกันกับที่ใช้โอนได้');
                    return;
                }

                // ค้นหาบัญชีปลายทางจากผู้ใช้อื่นใน Firestore
                try {
                    const usersRef = collection(db, "users");
                    const querySnapshot = await getDocs(usersRef);
                    let foundTarget = false;

                    querySnapshot.forEach((docSnap) => {
                        const userData = docSnap.data();
                        if (userData.accounts && Array.isArray(userData.accounts)) {
                            userData.accounts.forEach((acc, accIdx) => {
                                if (acc.accountNumber === receiverNum) {
                                    foundTarget = true;
                                    receiverDocId = docSnap.id;
                                    receiverAccountIndex = accIdx;
                                    receiverName = acc.accountName;
                                }
                            });
                        }
                    });

                    if (!foundTarget) {
                        receiverName = window.selectedReceiverParamName || 'บัญชีปลายทาง (บุคคลภายนอก)';
                    }
                } catch (err) {
                    console.error("Error searching receiver:", err);
                    alert("เกิดข้อผิดพลาดในการค้นหาบัญชีปลายทาง");
                    return;
                }
            }

            try {
                // หักเงินผู้ส่ง
                senderAcc.balance -= amountVal;
                accounts[activeIndex] = senderAcc;

                // เพิ่มเงินผู้รับ (ถ้าเป็นบัญชีคนอื่นในฐานข้อมูล)
                if (receiverDocId && receiverDocId !== userUid) {
                    const receiverRef = doc(db, "users", receiverDocId);
                    const receiverSnap = await getDoc(receiverRef);
                    if (receiverSnap.exists()) {
                        let receiverData = receiverSnap.data();
                        receiverData.accounts[receiverAccountIndex].balance += amountVal;
                        await updateDoc(receiverRef, { accounts: receiverData.accounts });
                    }
                } else if (receiverAccountIndex !== -1) {
                    // กรณีโอนให้บัญชีตัวเอง
                    accounts[receiverAccountIndex].balance += amountVal;
                }

                // อัปเดตข้อมูลผู้ส่งลง Firestore
                const senderRef = doc(db, "users", userUid);
                await updateDoc(senderRef, { accounts: accounts });
                localStorage.setItem('user_accounts', JSON.stringify(accounts));

                // บันทึกประวัติลง history
                const now = new Date();
                const dateStr = `${now.getDate().toString().padStart(2, '0')}/${(now.getMonth() + 1).toString().padStart(2, '0')}/${now.getFullYear()}`;
                const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`;

                const transactionRecord = {
                    accountNumber: senderAcc.accountNumber,
                    date: dateStr,
                    time: timeStr,
                    type: 'โอนเงินออก',
                    receiverName: receiverName,
                    receiverNum: receiverNum,
                    amount: amountVal,
                    note: noteVal
                };

                let historyList = JSON.parse(localStorage.getItem('transaction_history')) || [];
                historyList.unshift(transactionRecord);
                localStorage.setItem('transaction_history', JSON.stringify(historyList));

                // แสดงสลิป
                document.getElementById('slip-datetime').innerText = `${dateStr} ${timeStr}`;
                document.getElementById('slip-sender-name').innerText = senderAcc.accountName;
                document.getElementById('slip-sender-num').innerText = senderAcc.accountNumber;
                document.getElementById('slip-receiver-name').innerText = receiverName;
                document.getElementById('slip-receiver-num').innerText = receiverNum;
                document.getElementById('slip-amount').innerText = `฿${amountVal.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
                document.getElementById('slip-note').innerText = noteVal;

                document.getElementById('slipModal').style.display = 'flex';

            } catch (error) {
                console.error("Transfer error:", error);
                alert("เกิดข้อผิดพลาดในการทำรายการโอนเงิน กรุณาลองใหม่อีกครั้ง");
            }
        });
    </script>
</body>
</html>
